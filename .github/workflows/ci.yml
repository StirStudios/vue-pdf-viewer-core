name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Format Check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Pack Check
        run: npm run pack:check
      - name: Install playground deps
        run: npm install
        working-directory: playground
      - name: Build playground
        run: npm run build
        working-directory: playground
      - name: Install Nuxt playground deps
        run: npm install
        working-directory: playground-nuxt
      - name: Smoke Test (Vue + Nuxt playground builds)
        run: npm run smoke
