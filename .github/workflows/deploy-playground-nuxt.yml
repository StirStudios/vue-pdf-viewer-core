name: Deploy Nuxt Playground

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install root deps
        run: npm install
      - name: Build package artifacts
        run: npm run build
      - name: Install Nuxt playground deps
        run: npm install
        working-directory: playground-nuxt
      - name: Build Nuxt playground
        run: npm run build
        working-directory: playground-nuxt
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playground-nuxt/.output/public
          destination_dir: nuxt
          keep_files: true
