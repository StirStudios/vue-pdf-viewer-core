<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vue-pdf-viewer-core Demos</title>
    <meta
      name="description"
      content="Fast, lightweight PDF viewer for Vue 3 and Nuxt 4. Open the live Vite and Nuxt demos."
    />
    <meta
      http-equiv="refresh"
      content="0; url=/vue-pdf-viewer-core/playground/"
    />
    <link
      rel="canonical"
      href="https://stirstudios.github.io/vue-pdf-viewer-core/playground/"
    />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f6f6;
        color: #1f1f1f;
      }
      main {
        background: #fff;
        border: 1px solid #d9d9d9;
        border-radius: 12px;
        padding: 24px;
        max-width: 540px;
        width: calc(100% - 32px);
      }
      h1 {
        margin-top: 0;
        font-size: 1.2rem;
      }
      ul {
        padding-left: 20px;
      }
      a {
        color: #1255cc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>vue-pdf-viewer-core demos</h1>
      <p>If you are not redirected, open one of these:</p>
      <ul>
        <li><a href="/vue-pdf-viewer-core/playground/">Vite playground</a></li>
        <li><a href="/vue-pdf-viewer-core/nuxt/">Nuxt playground</a></li>
      </ul>
    </main>
  </body>
</html>
